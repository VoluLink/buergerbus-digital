# ==========================================================
# Wiederverwendbare Backend-Konfiguration
# ==========================================================
x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
    network: host
  restart: on-failure
  depends_on:
    db:
      condition: service_healthy
  environment:
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    ASPNETCORE_URLS: http://+:8080

    ConnectionStrings__Default: "server=db;port=3306;database=${DB_NAME};user=${DB_USER};password=${DB_PASSWORD};"

    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
    SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    SEED_INITIATIVE_NAME: ${SEED_INITIATIVE_NAME}
    DB_SEED_MAX_ATTEMPTS: ${DB_SEED_MAX_ATTEMPTS}

    JWT_SECRET: ${JWT_SECRET}
    JWT_ISSUER: ${JWT_ISSUER}
    JWT_AUDIENCE: ${JWT_AUDIENCE}
    JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES}

    FRONTEND_URL: ${FRONTEND_URL}

    EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
    EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
    EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME}
    EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
    EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
    EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
    EMAIL_USE_SSL: ${EMAIL_USE_SSL}

services:
  # ==========================================================
  # Frontend Development
  # ==========================================================
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buergerbus_frontend_dev
    profiles: ["dev"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend-dev

  # ==========================================================
  # Frontend Production / Staging
  # ==========================================================
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: buergerbus_frontend_prod
    profiles: ["staging", "prod"]
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend-prod

  # ==========================================================
  # Backend Development
  # - nach außen erreichbar über Server-IP:5000
  # ==========================================================
  backend-dev:
    <<: *backend-common
    container_name: buergerbus_backend_dev
    profiles: ["dev"]
    ports:
      - "5000:8080"

  # ==========================================================
  # Backend Production / Staging
  # - nicht direkt nach außen geöffnet
  # - nur intern im Docker-Netzwerk erreichbar
  # ==========================================================
  backend-prod:
    <<: *backend-common
    container_name: buergerbus_backend_prod
    profiles: ["staging", "prod"]
    expose:
      - "8080"

  # ==========================================================
  # MariaDB
  # ==========================================================
  db:
    image: mariadb:11
    container_name: buergerbus_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d

  # ==========================================================
  # Mailpit
  # - nur Development
  # ==========================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: buergerbus_mailpit
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8025:8025"
    expose:
      - "1025"

  # ==========================================================
  # phpMyAdmin
  # - Development/Staging
  # ==========================================================
  phpmyadmin:
    image: phpmyadmin
    container_name: buergerbus_phpmyadmin
    profiles: ["dev", "staging"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

  # ==========================================================
  # Nginx Proxy Manager
  # - Staging/Production
  # ==========================================================
  nginx:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    profiles: ["staging", "prod"]
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

  # ==========================================================
  # GitLab Runner
  # - separat
  # ==========================================================
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: gitlab-runner
    profiles: ["ci"]
    restart: always
    volumes:
      - ./gitlab-runner/config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  mariadb_data:
  npm_data:
  npm_letsencrypt: